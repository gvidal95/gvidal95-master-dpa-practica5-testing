config:
  target: "http://localhost:3000"
  plugins:
    ensure: {} # Falla automáticamente el proceso si no se cumplen los SLA
  phases:
    - duration: 20
      arrivalRate: 5
      name: "1. Fase de Calentamiento (Tráfico Base)"
    - duration: 30
      arrivalRate: 15
      rampTo: 50
      name: "2. Fase de Saturación Máxima (Pico de Carga)"
  ensure:
    thresholds:
      - "http.response_time.p99": 200 # El 99% debe procesarse en < 200ms
    maxErrorRate: 1 # Máximo 1% de caídas del socket HTTP

scenarios:
  - name: "Inundación transaccional perimetral (Payloads Mixtos Zod)"
    flow:
      # Flujo A: Datos Correctos -> Evalúa la tubería completa
      - post:
          url: "/api/v1/empleados"
          json:
            nombre: "Andrés Mendoza"
            cargo: "Software Architect"
            departamento: "I+D"
            sueldo: 4200
          capture:
            json: "$.data._id"
            as: "employeeId"
      - think: 1
      # Flujo B: Datos Corruptos -> Evalúa el rechazo inmediato del DTO Zod
      - post:
          url: "/api/v1/empleados"
          json:
            nombre: "Al"
            cargo: "Dev"
            departamento: "TI"
            sueldo: -500 # Campo ilegal